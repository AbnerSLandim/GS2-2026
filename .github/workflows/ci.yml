name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Testes da API e da logica
        run: python -m pytest tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Site - instalar
        run: npm ci
        working-directory: web
      - name: Site - checagem de tipos
        run: npm run lint
        working-directory: web
      - name: Site - build
        run: npm run build
        working-directory: web

      - name: Build da imagem Docker
        run: docker build -t alertaclima .
